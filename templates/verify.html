<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your account | Hooked on Solar</title><link rel="stylesheet" href="/static/portal.css"></head><body class="auth-page"><main class="auth-main"><a href="/" class="brand"><span class="document-logo"><img src="/static/brand.svg?v=2" alt="Hooked on Solar"></span></a><section class="card auth-card"><div class="eyebrow">STEP 2 OF 2</div><h1>Check your email</h1><p>Enter the 8-digit code sent to your account email. It expires in 10 minutes.</p>{% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Verification code<input name="code" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="one-time-code" required autofocus></label><button class="primary">Verify and sign in</button></form><p>Check your spam folder if it hasn’t arrived.</p><a href="/login">Sign in again to request a new code</a></section></main></body></html>
